<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>easyCode - レッスンモード</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&family=Archivo+Narrow:wght@400;500;600;700&family=Sometype+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" />
  <link rel="stylesheet" href="css/theme.css">
  <style>
    /* レッスンモードのレイアウト（色や文字は css/theme.css のトークンを使う） */
    :root { --c-accent: var(--c-problems); }
    html, body { height: 100%; overflow: hidden; }

    #shell {
      display: flex;
      height: calc(100vh - var(--topbar-h) - var(--gutter));
      overflow: hidden;
      /* 両端と下に必ず余白を残す。地の方眼がここから覗く */
      margin: 0 var(--gutter) var(--gutter);
      border: 1px solid var(--c-rule);
      border-top: 0;
      background: var(--c-paper);
    }

    /* ===== 左: コースと問題の一覧 ===== */
    #course-nav {
      flex: 0 0 260px;
      width: 260px;
      overflow-y: auto;
      padding: var(--sp-3);
      gap: var(--sp-3);
    }
    #course-nav:not(.is-open) { flex-basis: 0; width: 0; padding: 0; }

    .course-block { margin-bottom: var(--sp-3); }
    .course-head {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      width: 100%;
      padding: var(--sp-2);
      border: 1px solid var(--c-line);
      border-radius: var(--r-md);
      background: var(--c-surface);
      font-family: inherit;
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--c-ink);
      cursor: pointer;
      text-align: left;
    }
    .course-head:hover { border-color: var(--c-brand); background: var(--c-brand-soft); }
    /* いま開いているコース。面は塗らず、左端の朱の太罫で示す */
    .course-head[aria-current='true'] {
      border-color: var(--c-ink);
      box-shadow: inset 3px 0 0 var(--c-mark);
    }
    .course-head .count { margin-left: auto; font-size: var(--text-2xs); color: var(--c-ink-2); font-weight: 600; }
    .course-summary { margin: var(--sp-1) 0 0; font-size: var(--text-2xs); color: var(--c-ink-2); }

    .lesson-title {
      margin: var(--sp-2) 0 var(--sp-1);
      font-size: var(--text-2xs);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--c-ink-2);
    }
    .lesson-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--sp-2); }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 6px var(--sp-2);
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      background: none;
      font-family: inherit;
      font-size: var(--text-sm);
      color: var(--c-ink);
      cursor: pointer;
      text-align: left;
    }
    .lesson-item:hover { background: var(--c-surface-2); border-color: var(--c-line); }
    .lesson-item[aria-current='true'] {
      background: var(--c-paper-2);
      border-color: var(--c-rule);
      font-weight: 700;
      box-shadow: inset 3px 0 0 var(--c-mark);
    }
    /* 結線表の線の描き分け。解けた＝実線、未着手＝切れ目、模試＝二重線 */
    .lesson-item .mark {
      flex: 0 0 auto;
      width: 14px;
      height: 12px;
      align-self: center;
      background-repeat: no-repeat;
      background-position: center;
    }
    .lesson-item .mark[data-state='done'] {
      background-image: linear-gradient(var(--c-ink) 0 0);
      background-size: 14px 2px;
    }
    .lesson-item .mark[data-state='todo'] {
      background-image: linear-gradient(var(--c-ink-3) 0 0);
      background-size: 4px 2px;
    }
    .lesson-item .mark[data-state='mock'] {
      background-image: linear-gradient(var(--c-ink) 0 0), linear-gradient(var(--c-ink) 0 0);
      background-size: 14px 2px, 14px 2px;
      background-position: center top 3px, center bottom 3px;
    }
    .lesson-item[aria-current='true'] .mark[data-state] { background-image: linear-gradient(var(--c-mark) 0 0); background-size: 14px 2px; }
    .lesson-item .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lesson-item .kind { flex: 0 0 auto; font-size: var(--text-2xs); opacity: 0.8; }

    /* ===== 中: 問題文と解答 ===== */
    #problem-col {
      flex: 1 1 40%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      overflow-y: auto;
      padding: var(--sp-3);
      border-right: 1px solid var(--c-line);
    }
    #problem-head { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; flex: 0 0 auto; }
    #problem-text, #answer-area, #check-result, #ktph-note { flex: 0 0 auto; }
    /* この画面でいちばん大きい字。投影したときの見当になる */
    #problem-title { margin: 0; font-size: var(--text-2xl); line-height: 1.25; letter-spacing: -0.01em; }
    #problem-text { font-size: var(--text-base); line-height: 1.8; }
    #problem-text p { margin: 0 0 var(--sp-2); }
    #problem-text ul { margin: 0 0 var(--sp-2); padding-left: 1.4em; }
    #problem-text code { padding: 1px 5px; border-radius: var(--r-sm); background: var(--c-surface-3); font-size: 0.92em; }
    #problem-text pre {
      margin: 0 0 var(--sp-2);
      padding: var(--sp-2);
      border-radius: var(--r-md);
      background: var(--c-code-bg);
      color: var(--c-ink-on-dark);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      overflow-x: auto;
    }
    #problem-text pre code { padding: 0; background: none; }

    /* ずっと出ている「表記のきまり」。
       .note（何かが起きたときの知らせ）とは役割がちがうので、
       同じ強さで目立たせない。落ちついた囲みだけにする。 */
    .ktph-note {
      padding: var(--sp-2) var(--sp-3);
      border: 1px solid var(--c-line);
      border-radius: var(--r-md);
      background: var(--c-surface-2);
      font-size: var(--text-xs);
      line-height: 1.8;
      color: var(--c-ink-2);
    }

    #answer-area { display: flex; flex-direction: column; gap: var(--sp-2); }
    .answer-question { font-size: var(--text-base); font-weight: 600; }
    .answer-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    .answer-row input[type='text'] { flex: 1 1 200px; min-width: 0; }
    .choice-list { display: flex; flex-direction: column; gap: var(--sp-1); }
    .choice-item {
      display: flex;
      align-items: baseline;
      gap: var(--sp-2);
      padding: var(--sp-2);
      border: 1px solid var(--c-line);
      border-radius: var(--r-md);
      background: var(--c-surface);
      cursor: pointer;
    }
    .choice-item:hover { border-color: var(--c-brand); background: var(--c-brand-soft); }
    .choice-item code { font-family: var(--font-mono); font-size: var(--text-sm); }

    .blank-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    .blank-row .blank-key {
      flex: 0 0 auto;
      padding: 2px 8px;
      border-radius: var(--r-sm);
      background: var(--c-paper-2);
      border: 1px solid var(--c-rule);
      color: var(--c-ink);
      font-weight: 700;
      font-size: var(--text-sm);
    }
    .blank-row select { flex: 1 1 200px; min-width: 0; font-family: var(--font-mono); }
    .blank-row .judge { flex: 0 0 auto; width: 1.4em; text-align: center; }

    /* 難しさ。墨の面で塗らず、凡例と同じ番号の書体で書く */
    #problem-level {
      font-family: var(--font-label);
      font-size: var(--text-2xs);
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    #problem-level .of { color: var(--c-ink-3); }

    /* ヒントは 1 つずつ。番号は凡例と同じ書体で、左に揃える */
    .hint-step { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-2); }
    .hint-step .lane {
      flex: 0 0 auto;
      width: 1.4em;
      font-family: var(--font-label);
      font-weight: 600;
      color: var(--c-ink-3);
    }
    .hint-step > div { flex: 1 1 auto; min-width: 0; }
    #hint-text .btn { margin-top: var(--sp-1); }

    .task-list { margin: 0; padding-left: 1.3em; font-size: var(--text-base); line-height: 1.9; }

    /* ヒント・解説・AI は、同じ大きさの箱を並べない。
       1 本の罫でつないだ行にして、開いたものだけが場所を取る。 */
    #problem-col .expander {
      /* 縦に並ぶ列の中なので、押しつぶされないように高さを守る */
      flex: 0 0 auto;
      border: 0;
      border-top: 1px solid var(--c-rule);
      border-radius: 0;
      background: none;
    }
    #problem-col .expander:last-of-type { border-bottom: 1px solid var(--c-rule); }
    #problem-col .expander + .expander { margin-top: 0; }
    #problem-col .expander > summary {
      padding: var(--sp-2) 0;
      background: none;
      font-size: var(--text-sm);
    }
    #problem-col .expander[open] > summary { background: none; }
    #problem-col .expander-body { padding: 0 0 var(--sp-3); }

    /* ===== 右: エディタと結果 ===== */
    #work-col { flex: 1 1 60%; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2); }
    #panel-program { flex: 1 1 60%; min-height: 220px; }
    #panel-output { flex: 1 1 40%; min-height: 160px; }

    /* 見出しの道具が多い。狭いときは横に流して、切れたまま隠さない */
    #panel-program .panel-head { flex-wrap: wrap; row-gap: var(--sp-1); }
    #panel-program .panel-tools { margin-left: auto; }

    #program-body { position: relative; }
    .stage { position: absolute; inset: 0; display: none; }
    .stage.is-shown { display: block; }
    .stage .CodeMirror { position: absolute; inset: 0; height: auto; }
    #stage-flow { overflow: auto; background: var(--c-surface-2); }
    #flowchart { display: flex; align-items: flex-start; justify-content: center; padding: var(--sp-3); min-height: 100%; }
    #flowchart svg { max-width: 100%; height: auto; }
    #flowchart g.node.step-active > :is(rect, polygon, circle, ellipse, path) {
      stroke: var(--c-mark) !important;
      stroke-width: 3px !important;
    }

    /* 並べて結ぶ：左に Python、右に共通テスト表記。行の高さが同じなので、
       同じ行番号どうしが必ず真横に並ぶ。中央の帯がその対応を線で見せる。 */
    .pair-grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 28px 1fr; }
    .pair-slot { position: relative; min-width: 0; overflow: hidden; border-right: 1px solid var(--c-rule); }
    .pair-slot:last-child { border-right: 0; }
    .pair-slot .stage { display: block; }
    .pair-rail {
      position: relative;
      border-left: 1px solid var(--c-rule);
      border-right: 1px solid var(--c-rule);
      background-color: var(--c-paper);
      background-image: repeating-linear-gradient(
        to bottom,
        var(--c-rule) 0 1px,
        transparent 1px var(--pair-line, 21px));
      background-position: 0 var(--pair-top, 8px);
    }
    /* いま光っている行だけ、左右を朱の 1 本でつなぐ */
    .pair-mark {
      position: absolute;
      left: -1px;
      right: -1px;
      height: 2px;
      background: var(--c-mark);
    }
    .pair-mark::before, .pair-mark::after {
      content: '';
      position: absolute;
      top: -2px;
      width: 6px;
      height: 6px;
      border: 2px solid var(--c-mark);
      border-radius: 50%;
      background: var(--c-paper);
    }
    .pair-mark::before { left: -4px; }
    .pair-mark::after { right: -4px; }

    #ktph-warning { margin: 0; border-radius: 0; border-width: 0 0 1px; }

    #output-body { display: flex; flex-direction: column; }
    #output { flex: 1 1 auto; }

    #step-panel { flex: 0 0 auto; border-bottom: 1px solid var(--c-line); background: var(--c-surface-2); }
    .step-bar { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2); }
    .step-bar input[type='range'] { flex: 1 1 auto; min-width: 60px; }
    #step-vars { max-height: 34vh; overflow: auto; padding: 0 var(--sp-2) var(--sp-2); }

    #runtime-input-container {
      display: none;
      align-items: center;
      gap: var(--sp-2);
      flex: 0 0 auto;
      padding: var(--sp-2);
      border-top: 1px solid var(--c-line);
      background: var(--c-surface-2);
    }
    #runtime-input-container label { font-size: var(--text-sm); font-weight: 600; }
    #runtime-input { flex: 1 1 auto; min-width: 0; }

    .test-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .test-table th, .test-table td {
      padding: 4px var(--sp-2);
      border-bottom: 1px solid var(--c-line);
      text-align: left;
      vertical-align: top;
    }
    .test-table th { font-size: var(--text-2xs); color: var(--c-ink-2); font-weight: 700; }
    .test-table td.mono { font-family: var(--font-mono); white-space: pre-wrap; word-break: break-all; }
    .test-table tr.is-ng td { background: var(--c-bad-soft); }

    /* ===== 模試 ===== */
    .mock-score { font-size: var(--text-2xl); font-weight: 800; }
    .mock-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .mock-table th, .mock-table td { padding: 6px var(--sp-2); border-bottom: 1px solid var(--c-line); text-align: left; }

    /* ===== 狭い画面 ===== */
    @media (max-width: 1000px) {
      html, body { overflow: auto; }
      #shell { height: auto; flex-direction: column; }
      #course-nav { flex-basis: auto; width: auto; border-right: none; border-bottom: 1px solid var(--c-line); }
      #course-nav:not(.is-open) { display: none; }
      #problem-col { border-right: none; border-bottom: 1px solid var(--c-line); overflow: visible; }
      #work-col { min-height: 70vh; }
      /* 並べる幅が無いので、タブごと隠す */
      #program-tabs button[data-stage='pair'] { display: none; }
    }
  </style>
</head>
<body>
  <div id="loader" class="loader">
    <div class="spinner"></div>
    <p>Python の実行環境を準備しています…</p>
  </div>

  <header class="topbar">
    <button id="toggle-nav" class="icon-btn" aria-expanded="true" title="レッスンの一覧を開く／閉じる"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
    <a class="brand" href="index.html">
      <span class="brand-name">easyCode<small>02 レッスン</small></span>
    </a>
    <span class="topbar-divider"></span>

    <div class="topbar-tools">
      <button id="prev-problem" class="btn btn-sm">‹ 前</button>
      <span class="chip" id="current-label">レッスン</span>
      <button id="next-problem" class="btn btn-sm">次 ›</button>
      <span class="topbar-divider"></span>
      <button id="free-coding" class="btn btn-sm"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M4 16v-3l9-9 3 3-9 9z"/><path d="M11 6l3 3"/></svg>自由記述</button>
      <span class="chip is-warn" id="mock-chip" style="display:none;">模試の途中</span>
    </div>

    <div class="topbar-end">
      <nav class="mode-switch" aria-label="モードの切り替え">
        <a href="index.html" title="コードとブロックと図を行き来して、試す"><span class="lane">01</span><span class="label">実験</span></a>
        <a href="lessons.html" aria-current="page" title="入門から模試まで、順に解く"><span class="lane">02</span><span class="label">レッスン</span></a>
        <a href="drawing.html" title="p5.js で絵を描き、動かす"><span class="lane">03</span><span class="label">スケッチ</span></a>
        <a href="python-guide.html" title="Python の文法と共通テスト表記の早見表"><span class="lane">04</span><span class="label">早見表</span></a>
      </nav>
    </div>
  </header>

  <div id="shell">
    <!-- 左: コースと問題の一覧 -->
    <aside id="course-nav" class="sidebar">
      <p class="sidebar-title">レッスン</p>
      <div id="nav-body"></div>

      <details class="expander">
        <summary><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M10 7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.5 4.5l1.8 1.8M13.7 13.7l1.8 1.8M15.5 4.5l-1.8 1.8M6.3 13.7l-1.8 1.8"/></svg>設定</summary>
        <div class="expander-body stack">
          <div class="field">
            <label for="completion-mode-select">コード補完</label>
            <select id="completion-mode-select">
              <option value="both">インライン ＋ 候補一覧</option>
              <option value="popup-only">候補一覧だけ</option>
              <option value="inline-only">インラインだけ</option>
              <option value="none">使わない</option>
            </select>
            <p class="muted" id="completion-status"></p>
            <p class="muted" id="completion-description"></p>
          </div>

          <div class="field" id="api-key-form">
            <label for="api-key">Gemini API キー（省略できます）</label>
            <input type="password" id="api-key" placeholder="AIza…">
            <button id="save-api-key" class="btn btn-sm">保存</button>
            <p class="muted" id="api-key-status"></p>
            <p class="muted">キーが無くても、実行・答え合わせ・フローチャート・補完はすべて使えます。</p>
          </div>

          <button id="reset-progress" class="btn btn-sm btn-quiet"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M4 6h12"/><path d="M7 6V4h6v2"/><path d="M6 6l1 11h6l1-11"/></svg>記録の消去</button>
        </div>
      </details>
    </aside>

    <!-- 中: 問題文と解答 -->
    <section id="problem-col">
      <div id="problem-head">
        <h1 id="problem-title">レッスンを選んでください</h1>
        <span class="chip" id="problem-kind" style="display:none;"></span>
        <span class="chip" id="problem-level" style="display:none;"></span>
      </div>

      <div id="ktph-note" class="ktph-note" style="display:none;"></div>
      <div id="problem-text"></div>
      <div id="answer-area"></div>
      <div id="check-result"></div>

      <details class="expander" id="hint-box" style="display:none;">
        <summary><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M10 3a5 5 0 0 0-3 9v2h6v-2a5 5 0 0 0-3-9z"/><path d="M8 17h4"/></svg>ヒント</summary>
        <div class="expander-body" id="hint-text"></div>
      </details>

      <details class="expander" id="explain-box" style="display:none;">
        <summary><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M4 4h5a2 2 0 0 1 2 2v10a2 2 0 0 0-2-2H4z"/><path d="M16 4h-5a2 2 0 0 0-2 2v10a2 2 0 0 1 2-2h5z"/></svg>解説</summary>
        <div class="expander-body" id="explain-text"></div>
      </details>

      <details class="expander" id="ai-box">
        <summary><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M5 8h10v7H5z"/><path d="M10 5v3"/><path d="M7.5 11h1M11.5 11h1"/></svg>AI に相談</summary>
        <div class="expander-body stack">
          <button id="btn-explain" class="btn btn-sm btn-block">AI 解説</button>
          <div id="explanation" class="muted"></div>
          <button id="btn-review" class="btn btn-sm btn-block">AI 添削</button>
          <div id="review" class="muted"></div>
        </div>
      </details>

      <details class="expander" id="chat-box">
        <summary><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M3 4h14v9H8l-5 4z"/></svg>AI チャット</summary>
        <div class="expander-body stack">
          <div id="chat-messages" class="stack"></div>
          <div id="chat-input-container" class="row">
            <input type="text" id="chat-input" placeholder="わからないことを聞いてみましょう" class="grow">
            <button id="chat-send" class="btn btn-sm btn-mark">送信</button>
          </div>
        </div>
      </details>
    </section>

    <!-- 右: プログラムと実行結果 -->
    <section id="work-col">
      <div class="panel" id="panel-program">
        <div class="panel-head">
          <span class="tabs-label">表示するもの</span>
          <div class="tabs" id="program-tabs" role="tablist">
            <button type="button" data-stage="ktph" role="tab" aria-selected="false"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M4 4h12"/><path d="M6 4v12"/><path d="M9 8h7M9 12h5"/></svg>共通テスト表記</button>
            <button type="button" data-stage="python" role="tab" aria-selected="true"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M7 6 3 10l4 4"/><path d="m13 6 4 4-4 4"/></svg>Python</button>
            <button type="button" data-stage="flow" role="tab" aria-selected="false"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M7 3h6v3H7z"/><path d="M10 6v3"/><path d="M10 9l3 2.5-3 2.5-3-2.5z"/><path d="M10 14v3"/></svg>フローチャート</button>
            <button type="button" data-stage="pair" role="tab" aria-selected="false" title="Python と共通テスト表記を、同じ行番号で結んで並べます"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M3 3h5v14H3zM12 3h5v14h-5z"/><path d="M8 7h4M8 13h4"/></svg>並べて結ぶ</button>
          </div>
          <span class="panel-tools">
            <button class="tool-btn" id="code-indent" title="字下げをそろえます"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M3 5h14M7 10h10M7 15h10"/><path d="M3 8l2 2-2 2"/></svg>字下げ</button>
            <button class="tool-btn" id="code-format" title="記号まわりの空白も整えます"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M3 5h14M3 10h9M3 15h12"/></svg>整形</button>
            <button class="tool-btn panel-max" data-panel="panel-program" title="このパネルを大きく表示"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M4 8V4h4M16 12v4h-4"/></svg></button>
          </span>
        </div>
        <div class="note is-warn" id="ktph-warning" style="display:none;"></div>
        <div class="panel-body" id="program-body">
          <div class="stage" id="stage-ktph"><textarea id="code-ktph"></textarea></div>
          <div class="stage is-shown" id="stage-python"><textarea id="code"></textarea></div>
          <div class="stage" id="stage-flow"><div id="flowchart"></div></div>
          <!-- 同じ 1 本のプログラムを 2 つの姿で並べ、同じ行番号どうしを線で結ぶ -->
          <div class="stage" id="stage-pair">
            <div class="pair-grid">
              <div class="pair-slot" id="pair-left"></div>
              <div class="pair-rail" id="pair-rail"><span class="pair-mark" id="pair-mark" hidden></span></div>
              <div class="pair-slot" id="pair-right"></div>
            </div>
          </div>
        </div>
        <div class="button-group" style="display:flex; gap:var(--sp-2); padding:var(--sp-2); border-top:1px solid var(--c-line); flex-wrap:wrap;">
          <button id="run-btn" class="btn btn-run" disabled><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M6 4l10 6-10 6z"/></svg>実行</button>
          <button id="step-btn" class="btn btn-sm"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M5 4l7 6-7 6z"/><path d="M15 4v12"/></svg>ステップ実行</button>
          <button id="check-btn" class="btn btn-mark"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M4 10l4 4 8-9"/></svg>答え合わせ</button>
          <button id="ai-fix-code" class="btn btn-sm"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M5 8h10v7H5z"/><path d="M10 5v3"/><path d="M7.5 11h1M11.5 11h1"/></svg>AI 修正</button>
        </div>
      </div>

      <div class="panel" id="panel-output">
        <div class="panel-head">
          <span class="panel-title"><span class="lane">C</span><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M6 4l10 6-10 6z"/></svg>実行結果</span>
          <span class="panel-tools">
            <button class="tool-btn" id="output-clear"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M3 16h14"/><path d="M6 13 12 4l4 3-6 9z"/></svg>消去</button>
            <button class="tool-btn panel-max" data-panel="panel-output" title="このパネルを大きく表示"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M4 8V4h4M16 12v4h-4"/></svg></button>
          </span>
        </div>
        <div class="panel-body" id="output-body">
          <div id="step-panel" style="display:none;">
            <div class="step-bar">
              <button id="step-first" class="btn btn-sm"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M15 4l-7 6 7 6z"/><path d="M5 4v12"/></svg></button>
              <button id="step-prev" class="btn btn-sm"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M13 4l-7 6 7 6z"/></svg></button>
              <button id="step-next" class="btn btn-sm"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M6 4l10 6-10 6z"/></svg></button>
              <input type="range" id="step-slider" min="0" max="0" value="0">
              <span class="chip" id="step-label">0 / 0</span>
              <button id="step-exit" class="btn btn-sm btn-quiet"><svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M5 5h10v10H5z"/></svg>終了</button>
            </div>
            <div id="step-vars"></div>
          </div>

          <pre id="output" class="console">「実行」で動かせます</pre>

          <div id="runtime-input-container">
            <label for="runtime-input" id="runtime-input-label">値を入力</label>
            <input type="text" id="runtime-input" placeholder="入力してください">
            <button id="runtime-input-submit" class="btn btn-mark btn-sm">送信</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/comment/comment.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/display/rulers.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
  <script type="module" src="module/lessons.js"></script>
</body>
</html>
